name: CI
on: [push, pull_request]

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Install Vulkan SDK & glslang
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev glslang-tools
    - name: build
      run: |
        mkdir build && cd build
        cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ../src
        cmake --build . -j $(nproc)

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Install OpenMP
      run: brew install libomp
    - name: Setup Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        vulkan_version: 1.4.350.0
        cache: true
    - name: Locate MoltenVK
      run: |
        MVK_LIB=$(find "$VULKAN_SDK" -name "libMoltenVK.a" -type f 2>/dev/null | head -1)
        if [ -z "$MVK_LIB" ]; then
          MVK_LIB=$(find /Users/runner -name "libMoltenVK.a" -type f 2>/dev/null | head -1)
        fi
        echo "LIBMVK=$MVK_LIB" >> $GITHUB_ENV
        MVK_INCLUDE=$(dirname "$MVK_LIB" | sed 's|/MoltenVK.xcframework.*|/include|')
        echo "MVK_INCLUDE=$MVK_INCLUDE" >> $GITHUB_ENV
        echo "Found MoltenVK: $MVK_LIB"
    - name: build
      run: |
        mkdir build && cd build
        cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DUSE_STATIC_MOLTENVK=ON \
          -DOpenMP_C_FLAGS="-Xclang -fopenmp" -DOpenMP_CXX_FLAGS="-Xclang -fopenmp" \
          -DOpenMP_C_LIB_NAMES="libomp" -DOpenMP_CXX_LIB_NAMES="libomp" \
          -DOpenMP_libomp_LIBRARY="$(brew --prefix libomp)/lib/libomp.a" \
          -DOpenMP_libomp_INCLUDE_DIR="$(brew --prefix libomp)/include" \
          -DVulkan_INCLUDE_DIR="$MVK_INCLUDE" \
          -DVulkan_LIBRARY="$LIBMVK" \
          ../src
        cmake --build . -j $(sysctl -n hw.ncpu)

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Setup Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        vulkan_version: 1.4.350.0
        cache: true
    - name: build
      shell: cmd
      run: |
        mkdir build
        cd build
        cmake -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..\src
        cmake --build . --config Release -j 2
