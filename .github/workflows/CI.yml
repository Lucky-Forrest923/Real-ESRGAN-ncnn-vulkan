name: CI
on: [push, pull_request]

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Install Vulkan SDK & glslang
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev glslang-tools
    - name: build
      run: |
        mkdir build && cd build
        cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ../src
        cmake --build . -j $(nproc)

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Install dependencies
      run: |
        brew install libomp molten-vk glslang
    - name: Locate MoltenVK
      run: |
        echo "MVK_LIB=$(brew --prefix molten-vk)/lib/libMoltenVK.dylib" >> $GITHUB_ENV
        echo "MVK_INCLUDE=$(brew --prefix molten-vk)/include" >> $GITHUB_ENV
        echo "VULKAN_HEADERS=$(brew --prefix vulkan-headers)/include" >> $GITHUB_ENV
    - name: build
      run: |
        mkdir build && cd build
        cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DUSE_STATIC_MOLTENVK=ON \
          -DOpenMP_C_FLAGS="-Xclang -fopenmp" -DOpenMP_CXX_FLAGS="-Xclang -fopenmp" \
          -DOpenMP_C_LIB_NAMES="libomp" -DOpenMP_CXX_LIB_NAMES="libomp" \
          -DOpenMP_libomp_LIBRARY="$(brew --prefix libomp)/lib/libomp.a" \
          -DVulkan_INCLUDE_DIR="$VULKAN_HEADERS" \
          -DVulkan_LIBRARY="$MVK_LIB" \
          ../src
        cmake --build . -j $(sysctl -n hw.ncpu)

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Setup Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        vulkan_version: 1.4.350.0
        cache: true
    - name: build
      shell: cmd
      run: |
        mkdir build
        cd build
        cmake -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..\src
        cmake --build . --config Release -j 2
