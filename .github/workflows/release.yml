name: release
on:
  push:
    tags:
      - '*'

env:
  APPLICATION_NAME: realesrgan-ncnn-vulkan

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      APPNAME: ${{ steps.appname.outputs.APPNAME }}
      VERSION: ${{ steps.version.outputs.VERSION }}
    steps:
    - name: get-appname
      id: appname
      run: echo "APPNAME=${APPLICATION_NAME}" >> $GITHUB_OUTPUT
    - name: get-version
      id: version
      run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

  # ---- Ubuntu ----
  ubuntu:
    needs: [setup]
    runs-on: ubuntu-latest
    env:
      PACKAGENAME: ${{ needs.setup.outputs.APPNAME }}-${{ needs.setup.outputs.VERSION }}-ubuntu
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Install Vulkan SDK & glslang
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev glslang-tools
    - name: build
      run: |
        mkdir build && cd build
        cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ../src
        cmake --build . -j $(nproc)
    - name: package
      run: |
        mkdir -p ${{ env.PACKAGENAME }}
        cp README.md LICENSE ${{ env.PACKAGENAME }}
        cp build/${{ needs.setup.outputs.APPNAME }} ${{ env.PACKAGENAME }}
        strip -g ${{ env.PACKAGENAME }}/${{ needs.setup.outputs.APPNAME }}
        zip -9 -r ${{ env.PACKAGENAME }}.zip ${{ env.PACKAGENAME }}
    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.zip

  # ---- macOS ----
  macos:
    needs: [setup]
    runs-on: macos-latest
    env:
      PACKAGENAME: ${{ needs.setup.outputs.APPNAME }}-${{ needs.setup.outputs.VERSION }}-macos
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Install dependencies
      run: |
        brew install libomp molten-vk glslang vulkan-headers
    - name: Locate Vulkan paths
      run: |
        echo "VULKAN_HEADERS_DIR=$(brew --prefix vulkan-headers)/include" >> $GITHUB_ENV
        echo "MVK_LIB=$(find /opt/homebrew -name 'libMoltenVK.dylib' -o -name 'libMoltenVK.a' 2>/dev/null | head -1)" >> $GITHUB_ENV
        echo "VULKAN_LIB_DIR=$(find /opt/homebrew -name 'libvulkan.dylib' -o -name 'vulkan' -type d 2>/dev/null | head -1)" >> $GITHUB_ENV
    - name: build
      run: |
        export OMP_ROOT="$(brew --prefix libomp)"
        mkdir build && cd build
        cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DUSE_STATIC_MOLTENVK=ON \
          -DOpenMP_C_FLAGS="-Xclang -fopenmp -I$OMP_ROOT/include" \
          -DOpenMP_CXX_FLAGS="-Xclang -fopenmp -I$OMP_ROOT/include" \
          -DOpenMP_C_LIB_NAMES="libomp" -DOpenMP_CXX_LIB_NAMES="libomp" \
          -DOpenMP_libomp_LIBRARY="$OMP_ROOT/lib/libomp.a" \
          -DVulkan_INCLUDE_DIR="$VULKAN_HEADERS_DIR" \
          -DVulkan_LIBRARY="$MVK_LIB" \
          ../src
        cmake --build . -j $(sysctl -n hw.ncpu)
    - name: package
      run: |
        mkdir -p ${{ env.PACKAGENAME }}
        cp README.md LICENSE ${{ env.PACKAGENAME }}
        cp build/${{ needs.setup.outputs.APPNAME }} ${{ env.PACKAGENAME }}
        strip ${{ env.PACKAGENAME }}/${{ needs.setup.outputs.APPNAME }}
        zip -9 -r ${{ env.PACKAGENAME }}.zip ${{ env.PACKAGENAME }}
    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.zip

  # ---- Windows (produces .exe) ----
  windows:
    needs: [setup]
    runs-on: windows-latest
    env:
      PACKAGENAME: ${{ needs.setup.outputs.APPNAME }}-${{ needs.setup.outputs.VERSION }}-windows
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Setup Vulkan SDK
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        vulkan_version: 1.4.350.0
        cache: true
    - name: build
      shell: cmd
      run: |
        mkdir build
        cd build
        cmake -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ..\src
        cmake --build . --config Release -j 2
    - name: package
      shell: pwsh
      run: |
        mkdir ${{ env.PACKAGENAME }}
        Copy-Item -Verbose -Path "README.md" -Destination "${{ env.PACKAGENAME }}"
        Copy-Item -Verbose -Path "LICENSE" -Destination "${{ env.PACKAGENAME }}"
        Copy-Item -Verbose -Path "build\Release\${{ needs.setup.outputs.APPNAME }}.exe" -Destination "${{ env.PACKAGENAME }}"
        Copy-Item -Verbose -Path "C:\windows\system32\vcomp140.dll" -Destination "${{ env.PACKAGENAME }}"
        7z a -r ${{ env.PACKAGENAME }}.zip ${{ env.PACKAGENAME }}
    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGENAME }}
        path: ${{ env.PACKAGENAME }}.zip

  # ---- Release ----
  release:
    needs: [setup, ubuntu, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: download
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: create-release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.setup.outputs.VERSION }}
        name: Release ${{ needs.setup.outputs.VERSION }}
        draft: false
        prerelease: false
        files: artifacts/*/*.zip
